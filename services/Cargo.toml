[workspace]
members  = ["common", "authority-service", "location-service", "blocks-service", "favourites-service", "messages-service", "users-service", "gateway", "migration-service", "server"]
resolver = "2"

[workspace.dependencies]
axum               = "0.8"
tokio              = { version = "1", features = ["full"] }
mongodb            = "3"
jsonwebtoken       = "9"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
futures-util       = "0.3"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bcrypt             = "0.15"
reqwest            = { version = "0.12", features = ["json"] }
tower-http         = { version = "0.6", features = ["cors"] }
tera               = "1"
tokio-tungstenite  = "0.26"
url                = "2"
opaque-ke          = { version = "4.1.0-pre.1", features = ["ristretto255", "argon2", "std"] }
sha2               = "0.10"
hmac               = "0.12"
hex                = "0.4"
aes-gcm            = "0.10"
base64             = "0.22"
rand               = "0.8"
