<!-- Block user modal (triggered from map pin, public profile, message thread) -->
<div class="modal fade" id="blockModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width:360px">
    <div class="modal-content" style="border-color:var(--bbn-danger-border) !important">
      <div class="modal-header" style="border-bottom-color:var(--bbn-danger-border) !important">
        <h5 class="modal-title" style="color:var(--bbn-danger-text)">Block User</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted-bb mb-3">
          Block <strong id="blockTargetName"></strong>?
          They will no longer see you on the map, cannot message you, and cannot view your profile.
        </p>
        <label class="form-label" for="blockReason">Reason</label>
        <select class="form-select" id="blockReason">
          <option value="spam">Spam</option>
          <option value="harassment">Harassment</option>
          <option value="inappropriate_content">Inappropriate content</option>
          <option value="fake_profile">Fake profile</option>
          <option value="other">Other</option>
        </select>
        <div id="blockError" class="alert alert-danger mt-3 d-none"></div>
      </div>
      <div class="modal-footer" style="border-top-color:var(--bbn-danger-border) !important">
        <button type="button" class="btn btn-bbn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-bbn-danger" id="blockConfirmBtn">
          <i class="bi bi-slash-circle me-2"></i>Block User
        </button>
      </div>
    </div>
  </div>
</div>
