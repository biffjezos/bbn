{% extends "base.html" %}

{% block content %}
<div class="bbn-page bbn-fullbleed">

  <!-- Hero -->
  <div class="bbn-hero">
    <div class="container-fluid px-4 px-md-5">
      <h1>My <span class="accent-pink">Profile</span></h1>
    </div>
  </div>

  <!-- Content -->
  <div class="container-fluid px-4 px-md-5">
    <div class="row">
      <div class="col-12 col-lg-6">
        <div class="bbn-section" id="profileFormWrap">
          {% if ssr_me %}
          <p class="heading-serif fs-4 mb-1">{{ ssr_me.nickname }}</p>
          {% if ssr_me.age %}<p class="text-muted-bb small mb-1">{{ ssr_me.age }}{% if ssr_me.sex %} · {{ ssr_me.sex }}{% endif %}</p>{% endif %}
          {% if ssr_me.bio %}<p class="mt-2 mb-0">{{ ssr_me.bio }}</p>{% endif %}
          {% endif %}
        </div>
      </div>
    </div>
  </div>

</div>
{% endblock content %}
