title:       "bOOmbOOm.NOW!"
description: "Find who's nearby. Message in the moment."
baseurl:     ""
url:         "https://boom.up.railway.app"

# Backend API base URL (used in default.html layout)
api_url: "https://boom.up.railway.app/api"

# Markdown processor
markdown: kramdown

# Default layout for pages
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Collections
collections:
  pages:
    output: true
    permalink: /:path/

# Exclude from build
exclude:
  - README.md
  - "*.sh"
  - node_modules/
