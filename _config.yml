# ============================================================
# bOOmbOOm.NOW! — Jekyll Configuration
# ============================================================

title: "bOOmbOOm.NOW!"
description: "Find who's nearby. Message in the moment."
baseurl: ""
url: ""

# Build
markdown: kramdown
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

# Collections
collections:
  pages:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Thymeleaf pre-processing is handled in CI before Jekyll runs.
# Jekyll receives already-rendered HTML fragments as _includes.
