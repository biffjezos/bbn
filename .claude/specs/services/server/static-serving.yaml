---
id: services/server/static-serving
description: Static file serving and Tera template rendering — replaces Jekyll/GitHub Pages
additional_info:
related_spec: services/server/route-guards
related_ticket: T-28
pre_conditions:
  1: Template files exist in services/server/templates/
  2: Static assets exist in services/server/static/ (copied or symlinked from ui/)
sources:
  - /services/server/src/main.rs
  - /services/server/templates/
expected_behaviour:
  - "Tera templates: base.html layout with {% block %} inheritance; partials for navbar, offcanvas, modals"
  - "Page routes (/, /profile/, /favourites/, /messages/, /messages/thread/, /settings/, /admin/, /donate/, /profile/view/) render the corresponding Tera template"
  - "Static files (/assets/*, /scripts/*, /styles/*) served directly with correct MIME types and cache headers"
  - "/service-worker.js and /manifest.json served from static root"
  - "Base path is / — no /bbn prefix. All internal links and asset references use /"
  - "Template context always includes: is_logged_in, nickname, tier, role, sex (from route guard), asset_version (cache-bust string from ASSET_VERSION env var)"
  - "No window.BOOMBOOM_API_URL injected — JS uses relative /api/* paths"
  - "No window.BOOMBOOM_BASE injected — JS uses / as base"
  - "No inline route guard script in any template"
  - "Unknown routes return 404 page (not a proxy pass to gateway)"
status: implemented
tests:
  1: "GET / → renders index template with map div and FAB button"
  2: "GET /profile/ with valid JWT → renders profile page with navbar in logged-in state"
  3: "GET /assets/icons/icon-192.png → image served with correct content-type"
  4: "GET /scripts/boomboom.js → served as application/javascript"
  5: "GET /nonexistent → 404 page, not proxied to gateway"
  6: "No Liquid/Jekyll syntax ({% include %} with Liquid semantics, {{ site.* }}) in any served HTML"
  7: "asset_version appears in link/script href query strings for cache busting"
qa_report: |
  2026-03-30 — T-28 Phase 4 complete. MeData struct, fetch_me (3 s timeout,
  graceful None on any error), profile/settings handlers call fetch_me when
  auth.raw_token is present. profile.html renders nickname/age/sex/bio on
  first paint; settings.html renders tier/account_type in accountInfoWrap.
  JS overwrites on load (JS hydration path unchanged for T-29).
  2026-03-30 — T-28 Phase 2 complete. Templates created:
  base.html (Tera layout), 9 partials (navbar, offcanvas, 7 modals),
  9 page templates (index, messages, messages-thread, profile, profile-view,
  favourites, settings, admin, donate). All liquid/Jekyll syntax removed.
  /api/* uses relative paths (api.js API_BASE = ''). cargo build -p server
  passes with zero errors/warnings.
