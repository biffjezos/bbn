---
id: services/server/proxy
description: API and WebSocket reverse proxy — forwards all /api/* and /ws/* requests to the gateway unchanged
additional_info: Pure pass-through. No auth logic, no request transformation, no response modification.
related_spec: services/server/route-guards
related_ticket: T-28
pre_conditions:
  1: GATEWAY_URL and GATEWAY_ALLOWED_HOST env vars are set
  2: Gateway service is reachable at GATEWAY_URL
sources:
  - /services/server/src/proxy.rs
expected_behaviour:
  - All HTTP methods (GET, POST, PUT, DELETE, PATCH) to /api/* are forwarded to GATEWAY_URL/api/* with original headers, body, and query string intact
  - The Authorization header from the client is forwarded as-is (no injection, no stripping)
  - If the client sends a bbn_tok cookie but no Authorization header, the proxy does NOT inject one (that is the route guard's job for SSR only)
  - WebSocket upgrade requests to /ws/* are tunnelled to GATEWAY_URL/ws/*
  - "WebSocket proxy: extracts the browser Origin header from the incoming request and re-inserts it into the upstream WS handshake — required for gateway origin_ok() to pass"
  - Gateway responses (status, headers, body) are returned to the client unmodified
  - If the gateway is unreachable, return HTTP 502 to the client
  - The proxy adds no CORS headers — same-origin requests need none
  - GATEWAY_URL hostname is validated against GATEWAY_ALLOWED_HOST at startup; server refuses to start on mismatch
status: implemented
tests:
  1: "GET /api/health → proxied to gateway, 200 returned to client"
  2: "POST /api/auth/login/start with JSON body → body forwarded intact, response returned intact"
  3: "PUT /api/location with Authorization header → header forwarded, response returned"
  4: "GET /api/nonexistent → gateway 404 returned as-is to client"
  5: "Gateway down → client receives 502"
  6: "WebSocket upgrade to /ws/location → tunnel established, bidirectional messages pass through"
  7: "GATEWAY_ALLOWED_HOST mismatch → server refuses to start"
  8: "WebSocket upgrade: browser Origin header forwarded to gateway upstream handshake"
qa_report: >
  2026-03-30: proxy_ws extracts browser Origin header and inserts into upstream
  WS handshake. Without this, gateway origin_ok() saw no Origin and rejected
  all WS connections with 403.
