---
id: services/server/route-guards
description: Server-side route guards — protect authenticated and admin pages via JWT cookie validation
additional_info: Replaces the inline client-side guard script currently in default.html
related_spec: ui/auth
related_ticket: T-28
pre_conditions:
  1: JWT_SECRET env var is set (same HS256 key used by gateway)
  2: Client sets bbn_tok cookie on login (see ui/auth spec)
sources:
  - /services/server/src/guards.rs
expected_behaviour:
  - Read bbn_tok cookie from incoming request
  - Validate JWT signature (HS256 with JWT_SECRET) and expiry
  - Extract claims: sub, role, tier, nickname, sex, exp
  - "Protected routes (/messages/, /favourites/, /profile/, /settings/): require valid JWT with role in [user, admin, venue_manager]. On failure: HTTP 302 redirect to /"
  - "Admin route (/admin/): require valid JWT with role == admin. On failure: HTTP 302 redirect to /"
  - "Public routes (/, /donate/, /profile/view/): no guard. Serve to everyone."
  - If JWT is valid, inject into template context: is_logged_in=true, nickname, tier, role, sex
  - If JWT is missing or invalid on a public route, inject is_logged_in=false with null values
  - Never expose the raw JWT value in any template or HTML output
  - Never re-validate the JWT against the gateway — local HS256 verification is sufficient
status: planned
tests:
  1: "GET /messages/ without cookie → 302 redirect to /"
  2: "GET /messages/ with valid user JWT cookie → page rendered with is_logged_in=true"
  3: "GET /admin/ with valid user JWT (role=user) → 302 redirect to /"
  4: "GET /admin/ with valid admin JWT → page rendered"
  5: "GET / without cookie → page rendered with is_logged_in=false"
  6: "GET / with valid JWT cookie → page rendered with is_logged_in=true, navbar shows logged-in state"
  7: "GET /messages/ with expired JWT cookie → 302 redirect to /"
  8: "JWT claims (sub, role, tier, nickname) correctly injected into template context"
qa_report:
