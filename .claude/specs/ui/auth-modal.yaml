id: ui/auth-modal
description: Login and registration modal — form state lifecycle
additional_info: tests executed by owner
related_spec:
related_ticket:
pre_conditions:
pre_conditions:
  - Forms must carry onsubmit="return false" at the HTML level — native submission must be impossible regardless of JS state
  - wireAuthForms() must attach submit listeners before any async auth delay (before await window.__authReady)
  - Password field must not carry a name= attribute — prevents plaintext password appearing in any URL even if submission somehow fires
sources:
  - services/server/templates/partials/modal-login.html
  - services/server/templates/partials/modal-register.html
  - ui/scripts/boomboom.js (wireAuthForms)
expected_behaviour:
  - Login and registration forms are always empty after use
  - Form field values are deleted from memory (not just visually cleared) after submission or dismissal
status:
tests:
  1: register, navigate, logout, register > form should be empty and deleted from memory
  2: register, logout, register > form should be empty and deleted from memory
  3: login, navigate, logout, login > form should be empty and deleted from memory
  4: login, navigate, logout, login > form should be empty and deleted from memory
