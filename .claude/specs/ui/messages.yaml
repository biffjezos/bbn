id: ui/messages
description: Messages module — WS message stream, E2EE encrypt/decrypt, conversation and thread rendering
related_ticket: T-29
sources:
  - /ui/scripts/lib/messages.js
pre_conditions:
  1: window.Auth is set before connectMsgWS is called (set in boomboom.js initApp)
  2: window.BBNCrypto may or may not be unlocked; encrypted messages fall back gracefully
  3: Server proxies /ws/messages to gateway WS endpoint
expected_behaviour:
  - "initMessagesPage({ thread, convList }) is the entry point — call with flags for the current page"
  - "WS URL built from location.origin — no hardcoded host"
  - "WS auth: sends { type: 'auth', token } on open"
  - "WS reconnect: exponential backoff 1s → 30s on close"
  - "Incoming 'conversations' message: renders all threads in #convListWrap via handleConversationsUpdate"
  - "Incoming 'thread' message: renders messages in #threadWrap via handleThreadUpdate; auto-scrolls to bottom"
  - "Send: encrypts with BBNCrypto.encryptMessage if unlocked, falls back to plaintext; sends { type: 'send', toUserId, text } over WS"
  - "Decryption: getPublicKey() fetches sender/recipient public key (5 min cache); decryptFrom() returns '[encrypted]' if BBNCrypto locked, '[decryption failed]' on error"
  - "Venue accounts: getPublicKey() follows managerId redirect"
  - "getMyId(): reads sub claim from JWT; returns null on parse failure"
status: implemented
qa_report: "2026-03-30: WS URL fixed to location.origin pattern; Api imported directly; window.Auth.* retained (set by boomboom.js); window.BBNCrypto used for crypto (set by crypto.js itself)."
