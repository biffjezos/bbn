---
id: ui/lock
description: >
  Session lock — inactivity timer, tab-hidden timer, key locking, and unlock
  modal. Locks the in-memory ECDH private key after a period of inactivity or
  when the tab is hidden too long. Does NOT log the user out — only hides the
  private key and blocks the UI until the correct password is re-entered.
additional_info: >
  wireAuthHooks() must be called explicitly from boomboom.js after window.Auth
  is set. The old module-level Auth hook pattern failed because window.Auth is
  undefined at ES module evaluation time.
related_spec: ui/auth
related_ticket:
pre_conditions:
  1: window.Auth is set (by boomboom.js initApp) before wireAuthHooks() is called
  2: window.BBNCrypto is set (by crypto.js module evaluation) before lock() is called
  3: window.Api is set before tryUnlock() is called (needs getMyKeys / saveKeys)
  4: initUnlockButton() is called from initApp() after DOMContentLoaded — must NOT be wrapped in a DOMContentLoaded listener itself
  5: Bootstrap is loaded so bootstrap.Modal is available when getModal() is called
  6: lockModal, lockUnlockBtn, lockLogoutBtn, lockPassword, lockError elements exist in DOM (included via base.html → modal-lock.html)
sources:
  - /ui/scripts/lib/lock.js
  - /services/server/templates/partials/modal-lock.html
  - /ui/scripts/boomboom.js
expected_behaviour:
  - "lock(): sets _locked=true, clears inactivity timer, calls BBNCrypto.lock() to zero the private key in the worker, shows #lockModal. No-op if user is not registered or already locked."
  - "unlock(): sets _locked=false, restarts inactivity timer, hides #lockModal, dispatches bbn:unlocked CustomEvent"
  - "Inactivity timer: resets on mousemove/keydown/pointerdown/scroll/touchstart. Fires lock() after INACTIVITY_LOCK_MS (3 min) of silence. Only runs when user is registered."
  - "Tab-hidden timer: fires lock() if tab remains hidden for HIDE_LOCK_MS (30 s)"
  - "Tab-visible: cancels the hidden timer; restarts inactivity timer if not locked"
  - "wireAuthHooks(): chains into Auth.onLogin to reset timer + clear locked state; chains into Auth.onLogout to clear both timers and reset locked state. Must be called after window.Auth is set."
  - "initUnlockButton(): wires #lockUnlockBtn click and Enter key on #lockPassword to tryUnlock(); wires #lockLogoutBtn to Auth.logout() + modal hide"
  - "tryUnlock(): fetches encrypted key blob via Api.getMyKeys(); decrypts private key with PBKDF2+AES-GCM via BBNCrypto.unlock(); on success calls unlock(). If no keys on server, calls BBNCrypto.setup(password) and saves keys via Api.saveKeys(). Clears password field on every path."
  - "requireUnlocked(): synchronous check — returns true if BBNCrypto.isUnlocked(); otherwise shows modal and returns false. Callers (e.g. message send) use this before accessing crypto."
  - "The lock modal is data-bs-backdrop=static, data-bs-keyboard=false — cannot be dismissed without password or logout"
  - "Password field is always cleared after every unlock attempt (success or failure)"
  - "Logout from lock modal: calls Auth.logout(), which re-inits as guest and redirects away from protected pages"
status: implemented
tests:
  1: "After INACTIVITY_LOCK_MS ms of no user events: lockModal appears, BBNCrypto.isUnlocked() returns false"
  2: "Correct password in lock modal: keys restored, modal hidden, bbn:unlocked event dispatched"
  3: "Wrong password: lockError message shown, password field cleared, modal stays open"
  4: "Logout from lock modal: Auth.logout() called, user redirected to / from protected page"
  5: "Tab hidden for 30 s: lockModal appears"
  6: "Tab hidden < 30 s then returned: no lock"
  7: "requireUnlocked() returns false and shows modal when BBNCrypto locked"
  8: "wireAuthHooks() called after login: inactivity timer starts, _locked resets to false"
  9: "wireAuthHooks() called after logout: both timers cleared, _locked reset"
  10: "initUnlockButton() wires buttons correctly when called after DOMContentLoaded has fired"
qa_report: >
  2026-03-31: DOMContentLoaded wrapper removed from initUnlockButton() — buttons now
  wired correctly when called from initApp(). wireAuthHooks() extracted as explicit
  export, called after window.Auth is assigned. Lock/unlock flow and modal behaviour
  verified against expected_behaviour.
  2026-03-31 (fix): Added module-level DEBUG constant (window.location.search.includes('dbg'))
  to fix ReferenceError crash. Added document.activeElement.blur() before modal show/hide
  to prevent aria-hidden-focus accessibility warning.
