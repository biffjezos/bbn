---
id: ui/auth
description: Auth module — login, register, guest auth lifecycle, JWT storage and cookie contract
additional_info: "Post-refactor contract. Module must import Api directly (ES6 import), never use window.Api. Sets bbn_tok cookie for server-side guards."
related_spec: services/server/route-guards
related_ticket: T-29
pre_conditions:
  1: api.js is loaded and exports Api
  2: opaque-client WASM is loaded and available as window.OpaqueClient
sources:
  - /ui/scripts/lib/auth.js
expected_behaviour:
  - "ES6 module: imports Api from ./api.js. Does NOT use window.Api."
  - "Guest auth: calls Api.guestAuth(guestId), stores token in _token (memory only), starts countdown timer"
  - "Login: calls Api.login() via OPAQUE flow, stores JWT in sessionStorage (bbn_token), sets document.cookie bbn_tok=<jwt> (SameSite=Strict, Secure, Path=/)"
  - "Register: calls Api.register() via OPAQUE flow, same storage + cookie as login. Calls BBNCrypto.setup if available, saves keys via Api.saveKeys."
  - "Logout: clears sessionStorage (bbn_token, bbn_nickname), clears bbn_tok cookie (Max-Age=0), clears bbm_meet from localStorage, calls BBNCrypto.lock if available, re-inits as guest"
  - "Delete account: calls Api.deleteMe(), then same cleanup as logout"
  - "Token refresh: Auth.refreshToken(newToken) updates sessionStorage and bbn_tok cookie"
  - "Callbacks: onLogin, onLogout, onGuestReady, onGuestExpired, onNeedsUnlock, onRateLimited — all nullable, called at appropriate lifecycle points"
  - "Guest countdown: shows #guestCountdown element during guest session, hides on login/register"
  - "Expired guest cleanup: if guest expiry passed >1h ago, clear the stored expiry and re-auth"
  - "Never store the JWT in localStorage"
  - "Never expose the raw JWT in any DOM element"
status: implemented
tests:
  1: "Guest auth: on fresh load with no stored token, Api.guestAuth is called, countdown starts"
  2: "Login: after successful OPAQUE flow, JWT is in sessionStorage AND bbn_tok cookie is set"
  3: "Logout: sessionStorage cleared, bbn_tok cookie cleared, guest auth re-initiated"
  4: "Page reload with valid sessionStorage token: no re-auth, onLogin fires immediately"
  5: "Page reload with expired sessionStorage token: token cleared, guest auth starts"
  6: "Register: crypto keys generated and saved via Api.saveKeys after successful registration"
  7: "Cookie value matches sessionStorage token value exactly"
qa_report: "2026-03-30: Auth now imports Api from ./api.js; all window.Api.* calls replaced with Api.*; window.BBMCrypto → window.BBNCrypto (set by crypto.js itself); bbn_tok cookie set/cleared correctly. Complies with all expected_behaviour items."
