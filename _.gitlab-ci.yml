# ============================================================
# bOOmbOOm.NOW! — GitLab CI/CD Pipeline
#
# Stages:
#   1. preprocess  — Thymeleaf renders templates → static HTML fragments
#   2. build       — Jekyll compiles the site
#   3. deploy      — GitLab Pages publish
#
# Required CI/CD Variables (set in GitLab → Settings → CI/CD → Variables):
#   API_URL          — full URL of your Railway middleware, e.g. https://boomboom.up.railway.app/api
#   JEKYLL_ENV       — production
# ============================================================

image: ruby:3.2-alpine

stages:
  - preprocess
  - build
  - deploy

# ---- Cache gems between runs --------------------------------
cache:
  paths:
    - frontend/vendor/bundle

# ============================================================
# STAGE 1 — Thymeleaf pre-processing
# Uses the official Thymeleaf CLI jar to render any .th.html
# templates in frontend/_thymeleaf/ into static _includes/.
#
# If you have no Thymeleaf templates yet, this stage is a no-op.
# ============================================================
thymeleaf:
  stage: preprocess
  image: eclipse-temurin:21-jre-alpine
  script:
    - echo "=== Thymeleaf pre-processing ==="
    - |
      if [ -d "frontend/_thymeleaf" ] && [ "$(ls -A frontend/_thymeleaf)" ]; then
        # Download Thymeleaf CLI if not cached
        if [ ! -f /tmp/thymeleaf-cli.jar ]; then
          wget -q -O /tmp/thymeleaf-cli.jar \
            https://github.com/thymeleaf/thymeleaf-cli/releases/download/3.1.1/thymeleaf-cli-3.1.1.jar
        fi
        mkdir -p frontend/_includes/th
        java -jar /tmp/thymeleaf-cli.jar \
          --input  frontend/_thymeleaf \
          --output frontend/_includes/th \
          --suffix .html
        echo "Thymeleaf rendering complete."
      else
        echo "No Thymeleaf templates found — skipping."
      fi
  artifacts:
    paths:
      - frontend/_includes/th/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ============================================================
# STAGE 2 — Jekyll build
# ============================================================
jekyll_build:
  stage: build
  image: ruby:3.2-alpine
  needs: [thymeleaf]
  before_script:
    - apk add --no-cache build-base
    - cd frontend
    - gem install bundler --no-document
    - bundle config set --local path vendor/bundle
    - bundle install --jobs 4 --retry 3
  script:
    - echo "=== Jekyll build ==="
    # Inject API URL from CI variable into Jekyll config
    - |
      echo "api_url: \"${API_URL:-http://localhost:3000/api}\"" >> _config.yml
    - JEKYLL_ENV=production bundle exec jekyll build --destination ../public
    - echo "Jekyll build complete. Output in /public"
  artifacts:
    paths:
      - public/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# ============================================================
# STAGE 3 — GitLab Pages deploy
# The 'pages' job name is magic — GitLab picks it up automatically.
# ============================================================
pages:
  stage: deploy
  needs: [jekyll_build]
  script:
    - echo "Deploying to GitLab Pages…"
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
    url: https://$CI_PAGES_DOMAIN
