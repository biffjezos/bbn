[package]
name    = "opaque-client-wasm"
version = "0.1.0"
edition = "2021"

# Not part of services/ workspace — different build target (wasm32-unknown-unknown).

[lib]
crate-type = ["cdylib"]

[dependencies]
opaque-ke         = { version = "4.1.0-pre.1", features = ["ristretto255", "argon2", "std"] }
wasm-bindgen      = "0.2"
js-sys            = "0.3"
console_error_panic_hook = "0.1"
# getrandom with "js" ensures OsRng works in the browser under wasm32-unknown-unknown.
# Cargo feature unification applies "js" to whichever getrandom version rand/opaque-ke pulls in.
getrandom         = { version = "0.2", features = ["js"] }
sha2              = "0.10"
base64            = "0.22"

[profile.release]
opt-level = "z"
lto       = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false  # binaryen not available in this build environment
