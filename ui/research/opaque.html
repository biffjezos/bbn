<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OPAQUE-style Demo with Argon2 (libsodium)</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#111; color:#eee; padding:20px; }
    h1 { text-align:center; margin-bottom:10px; }
    .row { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
    input { padding:6px 8px; border-radius:4px; border:1px solid #444; background:#222; color:#eee; }
    button { padding:6px 10px; border-radius:4px; border:1px solid #666; background:#333; color:#eee; cursor:pointer; }
    button:disabled { opacity:.4; cursor:default; }
    textarea { width:100%; height:140px; background:#181818; color:#eee; border:1px solid #444; border-radius:4px; padding:4px; font-family:monospace; font-size:0.8em; }
    .cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .title { text-align:center; font-weight:bold; margin-bottom:4px; }
    .status { margin-top:10px; text-align:center; font-size:0.9em; color:#9fd29f; }
  </style>
</head>
<body>
<h1>OPAQUE-style Demo with Argon2 (libsodium)</h1>

<div class="row">
  <input id="username" placeholder="Username" value="alice">
  <input id="password" placeholder="Password" type="password" value="qwerty123">
  <button id="registerBtn">Register</button>
  <button id="loginBtn">Login</button>
</div>

<div class="cols">
  <div>
    <div class="title">Client</div>
    <textarea id="clientLog" readonly></textarea>
  </div>
  <div>
    <div class="title">Server</div>
    <textarea id="serverLog" readonly></textarea>
  </div>
</div>

<div id="status" class="status"></div>

<script src="https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/libsodium-wrappers.min.js"></script>
<script>
  let sodiumReady = (async () => {
    await sodium.ready;
    return sodium;
  })();

  // “Server-side” in-memory storage
  const serverDb = {
    user: null // { username, salt, envelopeNonce, envelopeCt, clientPub, serverStaticPub, serverStaticSec }
  };

  function log(elId, msg) {
    const el = document.getElementById(elId);
    el.value += msg + "\n";
    el.scrollTop = el.scrollHeight;
  }

  function setStatus(msg) {
    document.getElementById('status').textContent = msg;
  }

  document.getElementById('registerBtn').addEventListener('click', async () => {
    const sodium = await sodiumReady;
    const username = document.getElementById('username').value || "alice";
    const password = document.getElementById('password').value || "qwerty123";

    document.getElementById('clientLog').value = "";
    document.getElementById('serverLog').value = "";

    // 1) Client: derive password key using Argon2id (crypto_pwhash)
    const salt = sodium.randombytes_buf(sodium.crypto_pwhash_SALTBYTES);
    const pwKey = sodium.crypto_pwhash(
      32,
      password,
      salt,
      sodium.crypto_pwhash_OPSLIMIT_INTERACTIVE,
      sodium.crypto_pwhash_MEMLIMIT_INTERACTIVE,
      sodium.crypto_pwhash_ALG_ARGON2ID13
    );

    // 2) Client: generate static keypair for AKE
    const clientKp = sodium.crypto_kx_keypair();

    // 3) Client: encrypt private key into envelope using secretbox
    const nonce = sodium.randombytes_buf(sodium.crypto_secretbox_NONCEBYTES);
    const envelopeCt = sodium.crypto_secretbox_easy(
      clientKp.privateKey,
      nonce,
      pwKey
    );

    log("clientLog",
      "=== REGISTRATION (CLIENT) ===\n" +
      "username: " + username + "\n" +
      "salt: " + sodium.to_hex(salt) + "\n" +
      "clientPub: " + sodium.to_hex(clientKp.publicKey) + "\n" +
      "envelope.nonce: " + sodium.to_hex(nonce) + "\n" +
      "envelope.ct: " + sodium.to_hex(envelopeCt) + "\n"
    );

    // 4) Server: store salt, envelope, client public key, and a static server keypair
    const serverStaticKp = sodium.crypto_kx_keypair();
    serverDb.user = {
      username,
      salt,
      envelopeNonce: nonce,
      envelopeCt,
      clientPub: clientKp.publicKey,
      serverStaticPub: serverStaticKp.publicKey,
      serverStaticSec: serverStaticKp.privateKey
    };

    log("serverLog",
      "=== REGISTRATION (SERVER) ===\n" +
      "Stored for user '" + username + "':\n" +
      "salt: " + sodium.to_hex(salt) + "\n" +
      "clientPub: " + sodium.to_hex(clientKp.publicKey) + "\n" +
      "envelope.nonce: " + sodium.to_hex(nonce) + "\n" +
      "envelope.ct: " + sodium.to_hex(envelopeCt) + "\n" +
      "serverStaticPub: " + sodium.to_hex(serverStaticKp.publicKey) + "\n"
    );

    setStatus("Registration complete. Now click 'Login'.");
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const sodium = await sodiumReady;
    const username = document.getElementById('username').value || "alice";
    const password = document.getElementById('password').value || "qwerty123";

    document.getElementById('clientLog').value = "";
    document.getElementById('serverLog').value = "";

    if (!serverDb.user || serverDb.user.username !== username) {
      setStatus("No registered user '" + username + "' on server.");
      return;
    }

    const u = serverDb.user;

    // === LOGIN PHASE ===

    // 1) Client “requests login”; server responds with salt, envelope, server static pub
    log("serverLog",
      "=== LOGIN (SERVER → CLIENT) ===\n" +
      "Sending to client:\n" +
      "salt: " + sodium.to_hex(u.salt) + "\n" +
      "envelope.nonce: " + sodium.to_hex(u.envelopeNonce) + "\n" +
      "envelope.ct: " + sodium.to_hex(u.envelopeCt) + "\n" +
      "serverStaticPub: " + sodium.to_hex(u.serverStaticPub) + "\n"
    );

    // 2) Client: derive pwKey again with Argon2id and decrypt envelope
    const pwKey = sodium.crypto_pwhash(
      32,
      password,
      u.salt,
      sodium.crypto_pwhash_OPSLIMIT_INTERACTIVE,
      sodium.crypto_pwhash_MEMLIMIT_INTERACTIVE,
      sodium.crypto_pwhash_ALG_ARGON2ID13
    );

    let clientPriv;
    try {
      clientPriv = sodium.crypto_secretbox_open_easy(
        u.envelopeCt,
        u.envelopeNonce,
        pwKey
      );
    } catch (e) {
      log("clientLog", "=== LOGIN (CLIENT) ===\nDecryption failed. Wrong password?");
      setStatus("Login failed: wrong password.");
      return;
    }

    // Reconstruct client keypair
    const clientPub = u.clientPub;
    const clientKp = { publicKey: clientPub, privateKey: clientPriv };

    log("clientLog",
      "=== LOGIN (CLIENT) ===\n" +
      "Derived pwKey with Argon2id.\n" +
      "Decrypted clientPriv: " + sodium.to_hex(clientPriv) + "\n" +
      "clientPub: " + sodium.to_hex(clientPub) + "\n"
    );

    // 3) Both sides derive shared session keys using crypto_kx
    const clientSession = sodium.crypto_kx_client_session_keys(
      clientKp.publicKey,
      clientKp.privateKey,
      u.serverStaticPub
    );
    const serverSession = sodium.crypto_kx_server_session_keys(
      u.serverStaticPub,
      u.serverStaticSec,
      u.clientPub
    );

    log("clientLog",
      "client rx: " + sodium.to_hex(clientSession.sharedRx) + "\n" +
      "client tx: " + sodium.to_hex(clientSession.sharedTx) + "\n"
    );
    log("serverLog",
      "=== LOGIN (SERVER) ===\n" +
      "server rx: " + sodium.to_hex(serverSession.sharedRx) + "\n" +
      "server tx: " + sodium.to_hex(serverSession.sharedTx) + "\n"
    );

    const ok =
      sodium.to_hex(clientSession.sharedRx) === sodium.to_hex(serverSession.sharedTx) &&
      sodium.to_hex(clientSession.sharedTx) === sodium.to_hex(serverSession.sharedRx);

    setStatus(
      ok
        ? "OPAQUE-style flow complete: client and server share matching session keys."
        : "Session keys mismatch (something went wrong)."
    );
  });
</script>
</body>
</html>
