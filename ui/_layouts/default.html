<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}bOOmbOOm.NOW!</title>
  <meta name="theme-color" content="#0a0a0f" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="{{ '/styles/app.css' | relative_url }}" />
</head>
<body>

{% include navbar.html %}
{% include offcanvas-menu.html %}

{{ content }}

{% include modal-login.html %}
{% include modal-register.html %}
{% include modal-pin.html %}

<script>
  window.BOOMBOOM_API_URL = '{{ site.api_url | default: "https://hmmly-boom.up.railway.app/api" }}';
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>

<!-- api.js → Auth available as global -->
<script src="{{ '/scripts/api.js'  | relative_url }}"></script>
<script src="{{ '/scripts/auth.js' | relative_url }}"></script>

<!-- app.js — plain script, sets Auth hooks then calls Auth.init() -->
<script src="{{ '/scripts/app.js'  | relative_url }}"></script>

<!-- Redirect guests away from protected pages before any content renders -->
<script>
  (function () {
    var PROTECTED = ['/messages', '/favourites', '/profile'];
    var path = window.location.pathname;
    if (!PROTECTED.some(function(p) { return path.startsWith(p); })) return;

    var token = localStorage.getItem('bbm_token');
    var valid = false;
    if (token) {
      try {
        var payload = JSON.parse(atob(token.split('.')[1]));
        valid = payload.role === 'user' && (payload.exp * 1000) > Date.now();
      } catch (e) {}
    }
    if (!valid) {
      window.location.replace('/');
      throw new Error('Guest redirect.');
    }
  })();
</script>

<!-- map.js — plain IIFE, only runs if #map exists -->
<script src="{{ '/scripts/map.js' | relative_url }}"></script>

{% if page.extra_js %}
{% for js in page.extra_js %}
<script type="module" src="{{ js | relative_url }}"></script>
{% endfor %}
{% endif %}

</body>
</html>
