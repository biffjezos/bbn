<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}bOOmbOOm.NOW!</title>
  <meta name="description" content="Find who's nearby. Message in the moment." />
  <meta name="theme-color" content="#0a0a0f" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Leaflet (loaded on all pages — map.js checks for #map before init) -->
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" crossorigin="anonymous" />
  <!-- App design system -->
  <link rel="stylesheet" href="{{ '/styles/app.css' | relative_url }}" />
</head>
<body>

<!-- ============================================================
     NAVBAR
     ============================================================ -->
{% include navbar.html %}

<!-- ============================================================
     OFFCANVAS MENU
     ============================================================ -->
{% include offcanvas-menu.html %}

<!-- ============================================================
     MAIN CONTENT
     ============================================================ -->
{{ content }}

<!-- ============================================================
     GLOBAL MODALS — Login · Register · Map pin
     ============================================================ -->
{% include modal-login.html %}
{% include modal-register.html %}
{% include modal-pin.html %}

<!-- ============================================================
     API base URL — injected by Jekyll from _config.yml
     ============================================================ -->
<script>
  window.BOOMBOOM_API_URL = '{{ site.api_url | default: "https://hmmly-boom.up.railway.app/api" }}';
</script>

<!-- Bootstrap bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
<!-- App scripts — order matters -->
<script src="{{ '/scripts/api.js'  | relative_url }}"></script>
<script src="{{ '/scripts/auth.js' | relative_url }}"></script>
<script src="{{ '/scripts/map.js'  | relative_url }}"></script>
<script type="module" src="{{ '/scripts/app.js' | relative_url }}"></script>

{% if page.extra_js %}
{% for js in page.extra_js %}
<script type="module" src="{{ js | relative_url }}"></script>
{% endfor %}
{% endif %}

</body>
</html>
