<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}bOOmbOOm.NOW!</title>
  <meta name="theme-color" content="#0a0a0f" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="{{ '/styles/app.css' | relative_url }}" />
</head>
<body>

{% include navbar.html %}
{% include offcanvas-menu.html %}

{{ content }}

{% include modal-login.html %}
{% include modal-register.html %}
{% include modal-pin.html %}

<!-- API base URL from Jekyll config -->
<script>
  window.BOOMBOOM_API_URL = '{{ site.api_url | default: "https://hmmly-boom.up.railway.app/api" }}';
</script>

<!-- Third-party libs first — map.js and app.js depend on them -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>

<!-- api.js and auth.js are plain scripts — they set window.Api and window.Auth synchronously -->
<script src="{{ '/scripts/api.js'  | relative_url }}"></script>
<script src="{{ '/scripts/auth.js' | relative_url }}"></script>

<!--
  Auth is now available. Kick off Auth.init() immediately and store the
  promise on window.  Every page script — including ES modules — does:
      await window.__authReady;
  This guarantees the token is loaded and Auth.isRegistered() is correct
  before any API call is made, regardless of module evaluation order.
-->
<script>
  window.__authReady = Auth.init();
</script>

<!-- map.js is a plain IIFE — runs synchronously, uses window.Auth/Api -->
<script src="{{ '/scripts/map.js' | relative_url }}"></script>

<!-- app.js wires UI hooks; it also awaits window.__authReady -->
<script type="module" src="{{ '/scripts/app.js' | relative_url }}"></script>

{% if page.extra_js %}
{% for js in page.extra_js %}
<script type="module" src="{{ js | relative_url }}"></script>
{% endfor %}
{% endif %}

</body>
</html>
