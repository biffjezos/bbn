<!-- ============================================================
     NAVBAR
     Brand collapses to "b" icon below sm breakpoint.
     Status + countdown always visible. Hamburger always right.
     ============================================================ -->
     <nav class="navbar fixed-top" id="mainNav">
      <div class="container-fluid flex-nowrap gap-2">
    
        <!-- Brand — full text on sm+, single letter on xs -->
        <a class="navbar-brand flex-shrink-0" href="{{ '/' | relative_url }}">
          <span class="d-none d-sm-inline">bOOmbOOm<span class="brand-now">.NOW!</span></span>
          <span class="d-inline d-sm-none brand-icon">b</span>
        </a>
    
        <!-- Status badge — shrinks, never wraps -->
        <span class="bbm-status flex-shrink-1 text-truncate me-auto" id="statusBadge" style="min-width:0">
          <span class="bbm-status-dot" id="statusDot"></span>
          <span id="statusText" class="d-none d-md-inline">locating…</span>
        </span>
    
        <!-- Guest session countdown -->
        <span id="guestCountdown" class="d-none flex-shrink-0" style="font-size:0.72rem;color:var(--bbm-text-muted);white-space:nowrap">
          <i class="bi bi-clock" style="font-size:0.7rem"></i>
          <span id="countdownTimer">15:00</span>
        </span>
    
        <!-- Nav links — visible md+ -->
        <div class="d-none d-md-flex align-items-center gap-1 flex-shrink-0" id="navLinksDesktop"></div>
    
        <!-- Donation badge -->
        <a href="{{ '/donate/' | relative_url }}" class="bbm-donate-badge flex-shrink-0" title="Support bOOmbOOm.NOW!">
          <i class="bi bi-heart-fill"></i>
          <span class="d-none d-sm-inline">Support</span>
        </a>

        <!-- Hamburger — always visible, never pushed to next line -->
        <div class="position-relative flex-shrink-0">
          <span id="notifDot" class="d-none" style="width:8px;height:8px;background:#e5005a;border-radius:50%;position:absolute;top:4px;right:4px;pointer-events:none;z-index:1"></span>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#appMenu"
            aria-controls="appMenu"
            aria-label="Menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>

      </div>
    </nav>

    <!-- Notification banners (populated by NotifModule in app.js) -->
    <div id="notifBanner" style="position:fixed;top:56px;left:0;right:0;z-index:1029"></div>
