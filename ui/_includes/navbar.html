<!-- ============================================================
     NAVBAR
     Brand · Status badge · Hamburger (offcanvas trigger)
     ============================================================ -->
<nav class="navbar fixed-top" id="mainNav">
  <div class="container-fluid">

    <!-- Brand -->
    <a class="navbar-brand" href="{{ '/' | relative_url }}">
      bOOmbOOm<span style="opacity:0.7">.NOW!</span>
    </a>

    <!-- Location / session status -->
    <span class="bbm-status ms-3 me-auto" id="statusBadge">
      <span class="bbm-status-dot" id="statusDot"></span>
      <span id="statusText">locating…</span>
    </span>

    <!-- Guest session countdown (hidden for registered users) -->
    <span id="guestCountdown" class="d-none me-3">
      <i class="bi bi-clock me-1" style="font-size:0.7rem"></i>
      <span id="countdownTimer">15:00</span>
    </span>

    <!-- Nav links — visible md+ -->
    <div class="d-none d-md-flex align-items-center gap-1 me-2" id="navLinksDesktop">
      <!-- injected by app.js based on auth state -->
    </div>

    <!-- Hamburger — always visible -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#appMenu"
      aria-controls="appMenu"
      aria-label="Menu"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

  </div>
</nav>
