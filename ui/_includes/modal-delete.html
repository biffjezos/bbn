<!-- Delete account confirm (triggered from /profile danger zone) -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width:400px">
    <div class="modal-content" style="border-color:var(--bbn-danger-border) !important">
      <div class="modal-header" style="border-bottom-color:var(--bbn-danger-border) !important">
        <h5 class="modal-title" style="-webkit-text-fill-color:var(--bbn-danger-text);background:none;color:var(--bbn-danger-text)">
          Delete Account
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted-bb mb-3">
          This will permanently delete your account, messages and favourites.
          <strong class="text-pink"> This cannot be undone.</strong>
        </p>
        <label class="form-label" for="deleteNicknameInput">Type your nickname to confirm</label>
        <input type="text" class="form-control" id="deleteNicknameInput"
          autocomplete="off" placeholder="Your nickname" />
      </div>
      <div class="modal-footer" style="border-top-color:var(--bbn-danger-border) !important">
        <button type="button" class="btn btn-bbn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-bbn-danger" id="confirmDeleteBtn" disabled>Yes, delete everything</button>
      </div>
    </div>
  </div>
</div>
